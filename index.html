<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Oficial | Franelas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Header Minimalista -->
  <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-lg font-black tracking-wider uppercase text-gray-900">✨ Franelas Store</h1>
      <button onclick="toggleCart()" class="relative bg-gray-900 text-white px-4 py-2 rounded-full text-xs font-semibold hover:bg-gray-800 transition flex items-center gap-2">
        🛒 Carrito <span id="cart-counter" class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[10px]">0</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Filtros por Categoría / Género -->
    <div class="flex gap-2 overflow-x-auto pb-4 mb-6">
      <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-white transition">Todos</button>
      <button onclick="filterCategory('caballero')" id="cat-caballero" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border text-gray-600 hover:bg-gray-100 transition">Caballero</button>
      <button onclick="filterCategory('dama')" id="cat-dama" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border text-gray-600 hover:bg-gray-100 transition">Dama</button>
      <button onclick="filterCategory('nino')" id="cat-nino" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border text-gray-600 hover:bg-gray-100 transition">Niño</button>
      <button onclick="filterCategory('unica')" id="cat-unica" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border text-gray-600 hover:bg-gray-100 transition">Unisex</button>
    </div>

    <!-- Grid de Productos -->
    <div id="store-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Renderizado dinámico desde JS -->
    </div>
  </main>

  <!-- DRAWER / MODAL DEL CARRITO Y CHECKOUT -->
  <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
      <div class="flex justify-between items-center pb-4 border-b">
        <h2 class="text-base font-bold">Tu Carrito de Compras</h2>
        <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
      </div>

      <!-- Items del Carrito -->
      <div id="cart-items-container" class="flex-grow divide-y py-4 overflow-y-auto space-y-3">
        <!-- Render dinámico desde JS -->
      </div>

      <!-- Resumen y Formulario de Pedido -->
      <div class="pt-4 border-t space-y-4">
        <div class="flex justify-between text-base font-bold">
          <span>Total:</span>
          <span id="cart-total-amount" class="text-blue-600">$0.00</span>
        </div>

        <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-3 pt-2 border-t">
          <p class="text-xs font-bold text-gray-700">Datos para el Envío / Pedido</p>
          <div>
            <input type="text" id="cust-name" required placeholder="Nombre y Apellido" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-gray-900">
          </div>
          <div>
            <input type="text" id="cust-phone" required placeholder="Teléfono / WhatsApp" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-gray-900">
          </div>
          <div>
            <input type="email" id="cust-email" placeholder="Correo electrónico (opcional)" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-gray-900">
          </div>
          <div>
            <textarea id="cust-address" required rows="2" placeholder="Dirección de envío o ciudad" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-gray-900"></textarea>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl text-xs font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">
            Confirmar Pedido 🚀
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
