<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Franelas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm border border-gray-100">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Panel</h2>
    
    <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2.5 rounded-lg mb-4 text-xs font-medium"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admin@tienda.com" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-gray-900 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-gray-900 outline-none">
      </div>
      <button type="submit" class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition">Ingresar</button>
    </form>

    <!-- MFA Verify Form -->
    <form id="mfa-form" onsubmit="handleMFAChallenge(event)" class="space-y-4 hidden">
      <p class="text-xs text-gray-600 mb-2">Ingresa el código de 6 dígitos de tu aplicación de autenticación (TOTP):</p>
      <div>
        <input type="text" id="mfa-code" placeholder="123456" maxlength="6" required class="w-full border rounded-lg px-3 py-2 text-center text-lg font-mono tracking-widest focus:ring-2 focus:ring-gray-900 outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Verificar Código</button>
    </form>

    <!-- MFA Setup Form -->
    <form id="mfa-setup" onsubmit="handleMFAEnrollVerify(event)" class="space-y-4 hidden">
      <p class="text-xs text-gray-600 mb-2">Escanea este código QR con Google Authenticator o Authy:</p>
      <div class="flex justify-center bg-gray-50 p-3 rounded-lg border">
        <img id="qr-code-img" class="w-40 h-40 object-contain">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Código de verificación inicial:</label>
        <input type="text" id="setup-mfa-code" placeholder="123456" maxlength="6" required class="w-full border rounded-lg px-3 py-2 text-center text-lg font-mono tracking-widest focus:ring-2 focus:ring-gray-900 outline-none">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-green-700 transition">Activar y Acceder</button>
    </form>
  </div>
  <script src="admin.js"></script>
</body>
</html>
