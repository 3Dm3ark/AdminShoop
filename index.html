<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Multicomercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-lg font-black tracking-tight text-gray-900">🛍️ MULTICOMERCIO</h1>
      <div class="flex items-center space-x-3">
        <div class="text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-bold">
          BCV: <span id="bcv-rate-display">Cargando...</span>
        </div>
        <button onclick="toggleTrackingModal()" class="bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold transition">Rastrear Pedido</button>
        <button onclick="toggleCart()" class="bg-gray-900 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold relative transition">
          Carrito 🛒 <span id="cart-counter" class="absolute -top-1 -right-1 bg-red-500 text-white w-4 h-4 rounded-full text-[10px] flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- FILTROS DE SECCIÓN / GÉNERO -->
  <nav class="bg-white border-b py-2.5 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto no-scrollbar">
      <button onclick="filterProducts('all')" data-category="all" class="filter-btn bg-gray-900 text-white px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap">Todo</button>
      <button onclick="filterProducts('damas')" data-category="damas" class="filter-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap">Damas</button>
      <button onclick="filterProducts('caballero')" data-category="caballero" class="filter-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap">Caballero</button>
      <button onclick="filterProducts('ninos')" data-category="ninos" class="filter-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap">Niños</button>
      <button onclick="filterProducts('didactico')" data-category="didactico" class="filter-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap">Didáctico</button>
      <button onclick="filterProducts('metered')" data-category="metered" class="filter-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap">Por Metros (DTF)</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="store-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- CARRITO DRAWER -->
  <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 shadow-2xl flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <h2 class="font-bold text-base">Tu Carrito de Compras</h2>
          <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
        </div>
        <div id="cart-items-container" class="space-y-4 mb-6"></div>
      </div>

      <div class="border-t pt-4 space-y-4">
        <div class="flex justify-between font-black text-base">
          <span>Total:</span>
          <span id="cart-total-amount" class="text-blue-600">$0.00</span>
        </div>

        <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-3">
          <input type="text" id="cust-name" required placeholder="Nombre Completo" class="w-full border rounded-xl p-2.5 text-xs outline-none">
          <input type="tel" id="cust-phone" required placeholder="Teléfono / WhatsApp" class="w-full border rounded-xl p-2.5 text-xs outline-none">
          <input type="email" id="cust-email" placeholder="Correo Electrónico" class="w-full border rounded-xl p-2.5 text-xs outline-none">
          <textarea id="cust-address" required rows="2" placeholder="Dirección de envío o entrega" class="w-full border rounded-xl p-2.5 text-xs outline-none"></textarea>
          
          <select id="pay-method" required class="w-full border rounded-xl p-2.5 text-xs bg-white outline-none">
            <option value="">Selecciona Método de Pago</option>
            <option value="Pago Móvil">Pago Móvil</option>
            <option value="Transferencia Bancaria">Transferencia Bancaria</option>
            <option value="Binance">Binance</option>
            <option value="Efectivo / Divisas">Efectivo / Divisas</option>
          </select>
          <input type="text" id="pay-reference" required placeholder="Nro. de Referencia de Pago" class="w-full border rounded-xl p-2.5 text-xs outline-none">
          
          <div>
            <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Comprobante de Pago:</label>
            <input type="file" id="pay-proof-file" accept="image/*" required class="w-full border rounded-xl p-1.5 text-xs bg-white">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" onclick="clearCart()" class="w-1/3 border py-2.5 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100">Vaciar</button>
            <button type="submit" class="w-2/3 bg-gray-900 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-gray-800 transition">Confirmar Pedido 🚀</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL DE RASTREO -->
  <div id="tracking-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg p-6 rounded-2xl shadow-xl max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="font-bold text-sm">Rastrear tus Pedidos</h2>
        <button onclick="toggleTrackingModal()" class="text-gray-400 font-bold">✕</button>
      </div>
      <form onsubmit="trackOrder(event)" class="flex gap-2">
        <input type="text" id="track-input" required placeholder="Ingresa tu Teléfono o ID de Orden" class="w-full border rounded-xl p-2.5 text-xs outline-none">
        <button type="submit" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-xs font-bold">Buscar</button>
      </form>
      <div id="tracking-results" class="space-y-4 hidden"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
