<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin Multicomercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <h1 class="text-xl font-bold">🛠️ Panel Admin</h1>
        <nav class="hidden md:flex space-x-2">
          <button onclick="switchTab('products')" id="tab-products-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-900 text-white">Productos</button>
          <button onclick="switchTab('orders')" id="tab-orders-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-200">Pedidos</button>
        </nav>
      </div>
      <button onclick="logout()" class="text-sm font-medium text-red-600 hover:text-red-800">Cerrar Sesión</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <section id="section-products" class="space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Catálogo</h2>
        <button onclick="openProductModal()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium">+ Nuevo Producto</button>
      </div>
      <div id="admin-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </section>

    <section id="section-orders" class="space-y-6 hidden">
      <h2 class="text-2xl font-bold">Control de Pedidos y Etapas</h2>
      <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="bg-gray-50 border-b text-gray-700 font-semibold">
            <tr>
              <th class="p-3">Cliente</th>
              <th class="p-3">Contacto / Envío</th>
              <th class="p-3">Productos</th>
              <th class="p-3">Pago / Comprobante</th>
              <th class="p-3">Total</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL PRODUCTO -->
  <div id="product-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg p-6 rounded-xl shadow-xl max-h-[90vh] overflow-y-auto">
      <h2 id="modal-title" class="text-xl font-bold mb-4">Producto / Servicio</h2>
      <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
        <input type="hidden" id="prod-id">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Comercio / Producto</label>
          <select id="prod-type" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
            <option value="standard">Estándar / Didáctico</option>
            <option value="configurable">Confección (Ropa / Tallas)</option>
            <option value="metered">Impresión por Metro (DTF)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoría (Filtro superior)</label>
          <select id="prod-category" class="w-full border rounded-lg p-2.5 text-sm outline-none">
            <option value="damas">Damas</option>
            <option value="caballero">Caballero</option>
            <option value="ninos">Niños</option>
            <option value="didactico">Didáctico</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input type="text" id="prod-name" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
            <input type="number" step="0.01" id="prod-price" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
            <input type="number" id="prod-stock" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Posición</label>
            <input type="number" id="prod-sort" value="0" class="w-full border rounded-lg p-2.5 text-sm outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tallas (Separadas por coma)</label>
          <input type="text" id="prod-sizes" placeholder="S, M, L" class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Telas (Separadas por coma)</label>
          <input type="text" id="prod-fabrics" placeholder="Piqué, Algodón" class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cuellos (Separados por coma)</label>
          <input type="text" id="prod-collars" placeholder="V, Redondo, Polo" class="w-full border rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div class="flex items-center space-x-2">
          <input type="checkbox" id="prod-custom-text" class="w-4 h-4">
          <label for="prod-custom-text" class="text-sm font-medium text-gray-700">Permitir texto personalizado</label>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <textarea id="prod-desc" rows="2" class="w-full border rounded-lg p-2.5 text-sm outline-none"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Imagen Principal</label>
          <input type="file" id="prod-image-file" accept="image/*" class="w-full border rounded-lg p-2 text-sm">
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeProductModal()" class="px-4 py-2 border rounded-lg text-sm font-medium">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
